[project]
name = "voidkit"
version = "0.1.0"
description = "A modular terminal framework for security and network operations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "0xDiyor" }]
dependencies = [
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.urls]
Repository = "https://github.com/0xDiyor/voidkit"

[project.scripts]
voidkit = "voidkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voidkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
